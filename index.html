<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Hafifa Anggereni</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%); color: #444; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e1e24; padding: 16px 8%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15); position: sticky; top: 0; z-index: 1000; }
        .logo { color: #ff69b4; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
        nav a { color: #ffffff; text-decoration: none; margin-left: 15px; font-size: 14px; font-weight: 500; padding: 7px 14px; border-radius: 20px; transition: all 0.3s; }
        nav a:hover, nav a.active { color: #1e1e24; background-color: #ff8da1; }
        .container { max-width: 850px; width: 90%; margin: 40px auto; padding: 35px 30px; background: rgba(255, 255, 255, 0.9); border-radius: 24px; box-shadow: 0 10px 30px rgba(255, 105, 180, 0.2); flex: 1; text-align: center; }
        .profile-img { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; border: 4px solid #ff1493; box-shadow: 0 6px 20px rgba(255, 20, 147, 0.3); margin-bottom: 20px; }
        .hero h1 { font-size: 28px; color: #222; margin-bottom: 6px; font-weight: 700; }
        .badge-tkj { display: inline-block; background: #ff1493; color: white; padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; margin-bottom: 16px; }
        .hero p { font-size: 15px; color: #555; line-height: 1.7; max-width: 580px; margin: 0 auto 25px; }
        .btn { display: inline-block; padding: 12px 28px; background-color: #ff1493; color: white; text-decoration: none; border-radius: 25px; font-weight: 600; font-size: 14px; box-shadow: 0 4px 12px rgba(255, 20, 147, 0.3); transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); background-color: #d81b60; }
        footer { background-color: #1e1e24; color: #ffb6c1; text-align: center; padding: 18px; font-size: 13px; margin-top: auto; }
        @media (max-width: 600px) { header { flex-direction: column; gap: 12px; } nav a { margin: 0 3px; font-size: 12px; padding: 5px 10px; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">HAFIFA</div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="tentang.html">Tentang</a>

            <a href="bukutamu.html">Buku Tamu</a>

        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <img src="Images/01.jpeg" alt="Foto Hafifa Anggereni" class="profile-img">
            <h1>Hafifa Anggereni</h1>
            <span class="badge-tkj">Pelajar SMK - Jurusan TKJ</span>
            <p>Selamat datang di portofolio saya! Saya tertarik pada dunia komputer, jaringan, dan teknologi digital.</p>
            <a href="kontak.html" class="btn">Hubungi Saya</a>
        </section>
    </div>

    <footer>
        <p>© 2026 PORTOFOLIO HAFIFA ANGGERENI</p>
    </footer>

</body>
</html>

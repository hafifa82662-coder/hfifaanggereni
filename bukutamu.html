<!-- Isi Menu 6: Buku Tamu -->
        <div id="bukutamu" class="content-box tab-content" style="display: none;">
            <h2>Buku Tamu Digital</h2>
            <p class="sub-text">TINGGALKAN PESAN</p>
            <div class="info-list">
                <form id="bukuTamuForm" style="margin-top: 15px;">
                    <div style="margin-bottom: 15px;">
                        <label for="Nama" style="display: block; margin-bottom: 5px; font-weight: bold;">Nama:</label>
                        <input type="text" id="Nama" name="nama" required placeholder="Masukkan nama kamu..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label for="Pesan" style="display: block; margin-bottom: 5px; font-weight: bold;">Pesan:</label>
                        <textarea id="Pesan" name="pesan" required placeholder="Tulis pesan atau kesan..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; height: 100px; resize: vertical;"></textarea>
                    </div>
                    <button type="submit" id="submitBtn" style="width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Kirim Pesan</button>
                </form>
                <div id="status" style="text-align: center; margin-top: 15px; font-size: 14px;"></div>
            </div>
        </div>
